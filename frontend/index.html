<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/message-square.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Murmur is a real-time chat app for connecting through conversation. Message friends, share images, and stay in sync."
    />
    <meta property="og:title" content="Murmur - Connect Through Conversation" />
    <meta
      property="og:description"
      content="Real-time messaging with presence, typing indicators, and image sharing."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mumur.nayanswarnkar.com/" />
    <meta
      property="og:image"
      content="https://mumur.nayanswarnkar.com/preview.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://mumur.nayanswarnkar.com/preview.png"
    />
    <title>Murmur - Connect Through Conversation</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("chat-theme");
          var theme =
            saved ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
